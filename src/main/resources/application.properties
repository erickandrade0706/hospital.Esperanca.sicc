# ===== Servidor =====
server.port=8080
spring.application.name=sicc-backend

# ===== Banco de dados (H2 em arquivo: pasta data/ criada na raiz do projeto) =====
#spring.datasource.url=jdbc:h2:file:./data/sicc
#spring.datasource.username=sa
#spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Para usar MySQL, comente as 3 linhas de datasource acima e use:
 spring.datasource.url=jdbc:mysql://localhost:3306/sicc?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
 spring.datasource.username=root
 spring.datasource.password=

# ===== Seguranca =====
# Chave que assina o token JWT (minimo 32 caracteres). Em producao, defina a variavel de ambiente SICC_JWT_SEGREDO.
sicc.jwt.segredo=${SICC_JWT_SEGREDO:troque-este-segredo-sicc-hospital-esperanca-2026-chave-de-desenvolvimento}
# Tempo de validade do token (8 horas)
sicc.jwt.expiracao-minutos=480
# Bloqueio apos tentativas de login erradas
sicc.login.max-tentativas=5
sicc.login.minutos-bloqueio=15
# Endereco do front end (Angular) autorizado a chamar a API
sicc.cors.origens=http://localhost:4200

# ===== Dados iniciais (usuarios de teste do README, colaboradores, EPIs...) =====
sicc.dados-iniciais=true
